<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TwinViewer Demo — LIRIS Tunnel</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0e12;
        color: #e8eaed;
      }
      #app {
        display: grid;
        grid-template-columns: 300px 1fr;
        height: 100%;
      }
      aside {
        padding: 14px 16px;
        border-right: 1px solid #2a3038;
        background: #14181f;
        overflow: auto;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      label {
        display: block;
        font-size: 11px;
        color: #9aa0a6;
        margin: 10px 0 4px;
      }
      select,
      input[type='range'],
      button {
        width: 100%;
      }
      button {
        margin-top: 6px;
        padding: 7px 8px;
        border: 1px solid #3c4450;
        background: #242a32;
        color: inherit;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
      }
      button:hover {
        background: #2e3640;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      #viewer {
        min-height: 0;
        position: relative;
      }
      #status {
        margin-top: 12px;
        font-size: 11px;
        line-height: 1.45;
        white-space: pre-wrap;
        background: #0f1216;
        border: 1px solid #2a3038;
        border-radius: 6px;
        padding: 8px;
        min-height: 64px;
      }
      #status.error {
        color: #ff8a80;
      }
      #progress {
        font-size: 11px;
        color: #8ab4f8;
      }
      .hint {
        font-size: 10px;
        color: #6b7280;
        margin-top: 12px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside>
        <h1>TwinViewer · LIRIS Tunnel</h1>
        <div id="progress">loading…</div>

        <label for="mode">显示模式</label>
        <select id="mode">
          <option value="overlay" selected>overlay</option>
          <option value="mesh">mesh</option>
          <option value="pointcloud">pointcloud</option>
        </select>

        <label for="time">playbackTime = <span id="timeVal">0.0</span>s</label>
        <input id="time" type="range" min="0" max="75" step="0.1" value="0" />

        <label for="opacity">mesh opacity</label>
        <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="0.55" />

        <label>视角</label>
        <div class="row">
          <button id="cam-reset" type="button">reset</button>
          <button id="cam-top" type="button">top</button>
          <button id="cam-perspective" type="button">perspective</button>
          <button id="cam-front" type="button">front</button>
          <button id="cam-follow" type="button">followVehicle</button>
          <button id="cam-focus-evt" type="button">focus event</button>
        </div>
        <button id="cam-focus-dev" type="button">focus first device</button>
        <button id="btn-fail" type="button">simulate load failure</button>

        <div id="status">初始化…</div>
        <p class="hint">
          数据：CNRS LIRIS Synthetic Tunnel（ETALAB v2.0）。坐标 Y-up 米制，原始 OBJ/PLY
          不修改，仅用 transformMatrix。双击对象聚焦。
        </p>
      </aside>
      <div id="viewer"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
