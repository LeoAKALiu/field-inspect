components:
  schemas:
    Asset:
      properties:
        asset_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Asset Id
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        scene_version_id:
          type: string
          minLength: 1
          title: Scene Version Id
        position:
          $ref: '#/components/schemas/Position3D'
        marker_family:
          type: string
          minLength: 1
          title: Marker Family
        marker_id:
          type: integer
          minimum: 0.0
          title: Marker Id
        marker_role:
          type: string
          const: instrument_proxy
          title: Marker Role
        match_tolerance_m:
          type: number
          exclusiveMinimum: 0.0
          title: Match Tolerance M
        units:
          additionalProperties:
            type: string
          propertyNames:
            enum:
            - deep_base
            - shallow_base
            - delta
          type: object
          title: Units
        thresholds:
          additionalProperties:
            additionalProperties:
              type: number
            type: object
          propertyNames:
            enum:
            - deep_base
            - shallow_base
            - delta
          type: object
          title: Thresholds
          default: {}
        rule_version:
          type: string
          minLength: 1
          title: Rule Version
      additionalProperties: false
      type: object
      required:
      - asset_id
      - name
      - scene_version_id
      - position
      - marker_family
      - marker_id
      - marker_role
      - match_tolerance_m
      - units
      - rule_version
      title: Asset
    DataLineage:
      properties:
        source:
          type: string
          enum:
          - synthetic_fixture
          - simulation
          - replay
          - live_pending
          title: Source
        producer:
          anyOf:
          - type: string
          - type: 'null'
          title: Producer
        producer_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Producer Version
        derived_from:
          anyOf:
          - type: string
          - type: 'null'
          title: Derived From
      additionalProperties: false
      type: object
      required:
      - source
      - producer
      - producer_version
      - derived_from
      title: DataLineage
      description: 逐对象数据血缘：区分 synthetic_fixture / simulation / replay / live_pending。
    EventExportRequest:
      properties:
        format:
          type: string
          enum:
          - csv
          - json
          title: Format
        scene_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Scene Id
        task_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Id
        status:
          anyOf:
          - type: string
            enum:
            - open
            - acknowledged
            - resolved
            - false_positive
          - type: 'null'
          title: Status
        severity:
          anyOf:
          - type: string
            enum:
            - low
            - medium
            - high
            - critical
          - type: 'null'
          title: Severity
        type:
          anyOf:
          - type: string
            enum:
            - crack
            - water_leakage
            - spalling
            - corrosion
            - equipment_fault
            - obstacle
          - type: 'null'
          title: Type
      type: object
      required:
      - format
      title: EventExportRequest
    EventStatusUpdate:
      properties:
        status:
          type: string
          enum:
          - acknowledged
          - resolved
          - false_positive
          title: Status
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
        handled_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Handled By
      type: object
      required:
      - status
      title: EventStatusUpdate
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HistoryBatch:
      properties:
        run_id:
          type: string
          minLength: 1
          title: Run Id
        mapping:
          $ref: '#/components/schemas/HistoryMapping'
        source_type:
          type: string
          enum:
          - replay
          - simulation
          title: Source Type
        rows:
          items:
            additionalProperties: true
            type: object
          type: array
          maxItems: 10000
          minItems: 1
          title: Rows
      additionalProperties: false
      type: object
      required:
      - run_id
      - mapping
      - source_type
      - rows
      title: HistoryBatch
    HistoryMapping:
      properties:
        mapping_version:
          type: string
          minLength: 1
          title: Mapping Version
        source_reference:
          type: string
          minLength: 1
          title: Source Reference
        timezone:
          type: string
          minLength: 1
          title: Timezone
        timestamp_field:
          type: string
          minLength: 1
          title: Timestamp Field
        asset_field:
          type: string
          minLength: 1
          title: Asset Field
        asset_ids:
          additionalProperties:
            type: string
          type: object
          title: Asset Ids
        fields:
          additionalProperties:
            type: string
          propertyNames:
            enum:
            - deep_base
            - shallow_base
            - delta
          type: object
          title: Fields
        units:
          additionalProperties:
            type: string
          propertyNames:
            enum:
            - deep_base
            - shallow_base
            - delta
          type: object
          title: Units
        validity_seconds:
          type: integer
          maximum: 31536000.0
          exclusiveMinimum: 0.0
          title: Validity Seconds
        quality_field:
          type: string
          minLength: 1
          title: Quality Field
        quality_values:
          additionalProperties:
            type: string
            enum:
            - good
            - uncertain
            - bad
          type: object
          title: Quality Values
      additionalProperties: false
      type: object
      required:
      - mapping_version
      - source_reference
      - timezone
      - timestamp_field
      - asset_field
      - asset_ids
      - fields
      - units
      - validity_seconds
      - quality_field
      - quality_values
      title: HistoryMapping
    InstrumentReading:
      properties:
        contract_version:
          type: string
          const: '0.3'
          title: Contract Version
        reading_id:
          type: string
          minLength: 1
          title: Reading Id
        run_id:
          type: string
          minLength: 1
          title: Run Id
        asset_id:
          type: string
          minLength: 1
          title: Asset Id
        captured_at:
          type: string
          minLength: 1
          title: Captured At
        metrics:
          items:
            $ref: '#/components/schemas/NamedMetric'
          type: array
          minItems: 1
          title: Metrics
        quality:
          type: string
          enum:
          - good
          - uncertain
          - bad
          title: Quality
        valid_until:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Valid Until
        source_type:
          type: string
          enum:
          - simulation
          - replay
          - live_pending
          title: Source Type
        provenance:
          $ref: '#/components/schemas/Provenance'
        lineage:
          $ref: '#/components/schemas/DataLineage'
      additionalProperties: false
      type: object
      required:
      - contract_version
      - reading_id
      - run_id
      - asset_id
      - captured_at
      - metrics
      - quality
      - valid_until
      - source_type
      - provenance
      - lineage
      title: InstrumentReading
      description: 仪器读数：一组命名指标；valid_until 过期后不得作为当前状态展示。
    LiveIngestEnvelope:
      properties:
        source_id:
          type: string
          title: Source Id
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        payload:
          additionalProperties: true
          type: object
          title: Payload
      type: object
      required:
      - source_id
      - timestamp
      - payload
      title: LiveIngestEnvelope
      description: 预留报文信封，字段映射待甲方协议确认（整体 pending_confirmation）。
    MatchInput:
      properties:
        localization_id:
          type: string
          title: Localization Id
        marker_family:
          type: string
          title: Marker Family
        marker_id:
          type: integer
          minimum: 0.0
          title: Marker Id
      additionalProperties: false
      type: object
      required:
      - localization_id
      - marker_family
      - marker_id
      title: MatchInput
    MatchReview:
      properties:
        review_id:
          type: string
          minLength: 1
          title: Review Id
        match_id:
          type: string
          minLength: 1
          title: Match Id
        asset_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Asset Id
        operator_label:
          type: string
          maxLength: 100
          minLength: 1
          title: Operator Label
        reason:
          type: string
          maxLength: 1000
          minLength: 1
          title: Reason
        expected_review_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Expected Review Id
      additionalProperties: false
      type: object
      required:
      - review_id
      - match_id
      - asset_id
      - operator_label
      - reason
      title: MatchReview
    NamedMetric:
      properties:
        name:
          type: string
          enum:
          - deep_base
          - shallow_base
          - delta
          title: Name
        value:
          type: number
          title: Value
        unit:
          type: string
          minLength: 1
          title: Unit
      additionalProperties: false
      type: object
      required:
      - name
      - value
      - unit
      title: NamedMetric
      description: 命名指标：深基点 / 浅基点 / 差值，不复用单一匿名 value 语义。
    Position3D:
      properties:
        x:
          type: number
          title: X
        y:
          type: number
          title: Y
        z:
          type: number
          title: Z
      additionalProperties: false
      type: object
      required:
      - x
      - y
      - z
      title: Position3D
    Provenance:
      properties:
        source:
          type: string
          enum:
          - simulation
          - replay
          - live_pending
          title: Source
        status:
          type: string
          enum:
          - simulated
          - pending_confirmation
          - confirmed
          title: Status
      additionalProperties: false
      type: object
      required:
      - source
      - status
      title: Provenance
    ReadingInput:
      properties:
        reading:
          $ref: '#/components/schemas/InstrumentReading'
        mapping_version:
          type: string
          minLength: 1
          title: Mapping Version
        source_timezone:
          type: string
          minLength: 1
          title: Source Timezone
        source_reference:
          type: string
          minLength: 1
          title: Source Reference
        raw_fields:
          additionalProperties: true
          type: object
          title: Raw Fields
      additionalProperties: false
      type: object
      required:
      - reading
      - mapping_version
      - source_timezone
      - source_reference
      - raw_fields
      title: ReadingInput
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    OperatorSession:
      type: apiKey
      in: cookie
      name: astra_session
servers:
- url: /
security:
- BearerAuth: []
- OperatorSession: []
